# SonarCloud project configuration
# Документація: https://docs.sonarcloud.io/

sonar.projectKey=gemnyl_TournamentSystem
sonar.organization=gemnyl

sonar.projectName=Tournament Webservice
sonar.projectVersion=1.0

# ── Source directories ────────────────────────────────────────────────────────
sonar.sources=backend/apps,frontend/src

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx

# ── Test paths ────────────────────────────────────────────────────────────────
sonar.tests=backend/apps,frontend/src
sonar.test.inclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ── Python (backend) ──────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# ── JavaScript/TypeScript (frontend) ─────────────────────────────────────────
# lcov.info генерується тільки якщо запущені Vitest тести; без них frontend
# не має coverage-даних і виключається з розрахунку покриття.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
