##
# .github/workflows/sonar.yml
#
# SonarCloud static analysis.
# Тригер: push до main + будь-який PR.
# Потрібні secrets:
#   SONAR_TOKEN — згенерований у SonarCloud → My Account → Security
##

name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tournament_db_test
          POSTGRES_USER: tournament_user
          POSTGRES_PASSWORD: tournament_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_user -d tournament_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: sonar-ci-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tournament_db_test
      DB_USER: tournament_user
      DB_PASSWORD: tournament_pass
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      USE_REDIS_CHANNEL_LAYER: "True"

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud потребує повної історії для blame-аналізу
          fetch-depth: 0

      # ── Python coverage для backend ──────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Generate backend coverage report
        working-directory: backend
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml:coverage.xml \
            -q

      # ── Node build для frontend ──────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── SonarCloud scan ──────────────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
