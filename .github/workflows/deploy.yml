##
# .github/workflows/deploy.yml
#
# Безперервне доставлення (CD) на віртуальний сервер (Azure VM) через SSH.
# Тригер: успішне завершення конвеєра CI на гілці main (або ручний запуск).
#
# Кроки:
#   1. Збірка backend- і frontend-образів та публікація в GHCR.
#   2. Копіювання compose.prod.yml + Caddyfile на VM.
#   3. SSH на VM → pull нових образів → up -d → міграції БД.
#
# Потрібні secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST            — публічна IP-адреса або FQDN сервера
#   DEPLOY_USER            — користувач SSH на сервері (напр. azureuser)
#   DEPLOY_SSH_KEY         — приватний SSH-ключ для входу на сервер
#   GHCR_PAT               — PAT з правом read:packages (для pull на VM; не треба, якщо пакети публічні)
#   VITE_GOOGLE_CLIENT_ID  — client id Google OAuth (вбудовується у фронтенд під час збірки)
##

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tournament-backend:latest
            ghcr.io/${{ github.repository_owner }}/tournament-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tournament-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tournament-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "compose.prod.yml,Caddyfile"
          target: "app"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml run --rm backend python manage.py migrate --noinput
            docker image prune -f
