##
# .github/workflows/ci.yml
#
# Тригер: будь-який push + відкриття/оновлення PR до будь-якої гілки.
# Jobs:
#   backend-lint          — ruff check + ruff format --check
#   backend-test          — pytest з coverage, upload до Codecov
#   frontend-lint         — eslint + tsc --noEmit
#   frontend-build        — npm run build
#   docker-backend-build  — docker build (без push на PR)
#   docker-frontend-build — docker build (без push на PR)
#   dependency-audit      — pip-audit + npm audit (сканування вразливостей залежностей)
##

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ── Backend lint ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tournament_db_test
          POSTGRES_USER: tournament_user
          POSTGRES_PASSWORD: tournament_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_user -d tournament_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tournament_db_test
      DB_USER: tournament_user
      DB_PASSWORD: tournament_pass
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      USE_REDIS_CHANNEL_LAYER: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Frontend lint ────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Dependency vulnerability audit ───────────────────────────────────────────
  dependency-audit:
    name: Security — Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit backend dependencies (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --desc

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies (npm audit)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 3

  # ── Docker backend build ─────────────────────────────────────────────────────
  docker-backend-build:
    name: Docker — Backend build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t tournament-backend:${{ github.sha }} ./backend

  # ── Docker frontend build ────────────────────────────────────────────────────
  docker-frontend-build:
    name: Docker — Frontend build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build --build-arg VITE_GOOGLE_CLIENT_ID="" -t tournament-frontend:${{ github.sha }} ./frontend

  # ── E2E (Playwright) ─────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start the full docker-compose stack
        run: docker compose up -d --build
        env:
          VITE_GOOGLE_CLIENT_ID: ""

      # frontend depends_on backend: condition: service_healthy, so waiting for
      # nginx on :80 implicitly covers db → redis → backend → frontend ordering.
      - name: Wait for the app to be ready
        run: timeout 180 bash -c 'until curl -sf http://localhost/ >/dev/null; do sleep 3; done'

      # The Dockerfile CMD starts daphne directly without running migrations.
      # On a fresh CI volume the DB is empty, so we migrate explicitly here.
      - name: Run Django migrations
        run: docker exec tournament-webservice-backend-1 python manage.py migrate --noinput

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (Chromium + system deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
